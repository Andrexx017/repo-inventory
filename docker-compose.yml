services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      # Scripts numerados de database/init/ se ejecutan una sola vez, en orden,
      # solo si el volumen postgres_data está vacío (comportamiento de la imagen
      # oficial). Si el esquema cambia sobre una base ya inicializada, no vuelve
      # a correr solo con `docker compose up` — hay que recrear el volumen.
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # ASP.NET Core la lee automáticamente como ConnectionStrings:Default
      # (doble guion bajo = separador de sección jerárquica en la configuración
      # de .NET). Ver Infrastructure/Persistence/AppDbContext.cs y Program.cs.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Smtp__User: "${SMTP_USER}"
      Smtp__Password: "${SMTP_PASSWORD}"

    ports:
      - "5107:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL}"
    container_name: frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data: